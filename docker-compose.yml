services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-dev-password-change-me
      MARIADB_ROOT_PASSWORD: local-root-password-change-me
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-dev-password-change-me
      WORDPRESS_DEBUG: "0"
      WP_TESTS_DIR: /var/wordpress-tests/tests-lib
      WP_CORE_DIR: /var/wordpress-tests/wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/woocommerce-product-unpublisher
      - wp_test_data:/var/wordpress-tests

volumes:
  db_data:
  wordpress_data:
  wp_test_data:
