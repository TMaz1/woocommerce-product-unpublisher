<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wordpress-8080-error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress-8080-access.log combined
</VirtualHost>