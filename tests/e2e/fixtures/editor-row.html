<!doctype html>
<html>
<head><meta charset="utf-8"><title>Product editor fixture</title></head>
<body>
<!-- Markup mirrors templates/editor-row.php inside the classic editor form. -->
<form id="post" method="post">
	<div class="misc-pub-section curtime misc-pub-curtime" id="wpu-publish-row">
		<span id="wpu-timestamp">
			<span id="wpu-label">Unpublish on:</span>
			<strong id="wpu-current-value">Not scheduled</strong>
		</span>
		<a href="#wpu-edit" class="edit-timestamp" id="wpu-edit-toggle" role="button" aria-expanded="false" aria-controls="wpu-edit-panel"><span>Edit</span></a>
		<input type="hidden" name="wpu_action" id="wpu_action" value="">
		<fieldset id="wpu-edit-panel" hidden>
			<div class="timestamp-wrap">
				<select id="wpu_mm" name="wpu_mm"><option value="01">01-Jan</option><option value="12" selected>12-Dec</option></select>
				<input type="text" id="wpu_jj" name="wpu_jj" value="24">,
				<input type="text" id="wpu_aa" name="wpu_aa" value="2026"> at
				<input type="text" id="wpu_hh" name="wpu_hh" value="10">:<input type="text" id="wpu_mn" name="wpu_mn" value="00">
			</div>
			<p id="wpu-error" class="wpu-error" role="alert" hidden></p>
			<p>
				<a href="#wpu-save" class="save-timestamp button" id="wpu-ok">OK</a>
				<a href="#wpu-cancel" class="cancel-timestamp button-cancel" id="wpu-cancel">Cancel</a>
				<a href="#wpu-remove" class="wpu-remove" id="wpu-remove" hidden>Remove schedule</a>
			</p>
		</fieldset>
	</div>
	<input type="submit" id="publish" value="Update">
</form>
</body>
</html>
