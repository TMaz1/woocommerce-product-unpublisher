<!doctype html>
<html>
<head><meta charset="utf-8"><title>Products list fixture</title></head>
<body>
<!-- Markup mirrors wp-admin/edit.php?post_type=product with the Bulk Edit row open. -->
<form id="posts-filter" method="get">
	<table class="wp-list-table"><tbody id="the-list">
		<tr id="post-101" class="iedit type-product status-publish"><th><input type="checkbox" name="post[]" value="101" id="cb-select-101"></th><td>Published A</td></tr>
		<tr id="post-102" class="iedit type-product status-publish"><th><input type="checkbox" name="post[]" value="102" id="cb-select-102"></th><td>Published B</td></tr>
		<tr id="post-103" class="iedit type-product status-draft"><th><input type="checkbox" name="post[]" value="103" id="cb-select-103"></th><td>Draft C</td></tr>
	</tbody></table>

	<table><tbody>
	<tr id="bulk-edit" style="display: table-row"><td>
		<div class="inline-edit-group wpu-bulk-edit">
			<fieldset>
				<legend>Unpublishing schedule</legend>
				<label><input type="radio" name="wpu_bulk_action" value="none" checked="checked"><span>No change to existing schedules</span></label>
				<label><input type="radio" name="wpu_bulk_action" value="schedule"><span>Schedule unpublishing</span></label>
				<label><input type="radio" name="wpu_bulk_action" value="remove"><span>Remove scheduled unpublishing</span></label>
				<label><input type="radio" name="wpu_bulk_action" value="unpublish_now"><span>Unpublish published products now</span></label>
			</fieldset>
			<div id="wpu-bulk-date-fields" hidden>
				<p><strong>Unpublish on:</strong></p>
				<div class="timestamp-wrap">
					<select id="wpu_bulk_mm" name="wpu_bulk_mm"><option value="01">01-Jan</option><option value="12" selected>12-Dec</option></select>
					<input type="text" id="wpu_bulk_jj" name="wpu_bulk_jj" value="24" size="2" maxlength="2">,
					<input type="text" id="wpu_bulk_aa" name="wpu_bulk_aa" value="2026" size="4" maxlength="4"> at
					<input type="text" id="wpu_bulk_hh" name="wpu_bulk_hh" value="10" size="2" maxlength="2">:<input type="text" id="wpu_bulk_mn" name="wpu_bulk_mn" value="00" size="2" maxlength="2">
				</div>
				<p id="wpu-bulk-error" class="wpu-error" role="alert" hidden></p>
			</div>
		</div>
		<button type="button" class="button cancel">Cancel</button>
		<button type="submit" id="bulk_edit" class="button button-primary">Update</button>
	</td></tr>
	</tbody></table>
</form>
</body>
</html>
